[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bosonic-algo"
version = "0.1.0"
description = "Reproducible Fourier and bosonic Shin-Metiu dynamics"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.12", "matplotlib>=3.8", "pandas>=2.0", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "nbformat>=5.10"]
# bosonic_qiskit availability depends on hardware/simulation environment.
# Install it alongside a compatible Qiskit before running TGIFS.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
